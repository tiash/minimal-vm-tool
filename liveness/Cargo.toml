[package]
name = "minimal-vm-liveness"
version.workspace = true
edition.workspace = true

[dependencies]
minimal-vm-liveness-protocol = { path = "../liveness/protocol" }
libc = "0.2.190"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.2", features = ["io-util", "net", "signal", "macros", "rt", "rt-multi-thread", "time", "process", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.104"
log = "0.4.34"
stderrlog = "0.6.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
simple-test-logging = { git = "https://github.com/tiash/simple-test-logging.git" }
expect-test = "1.5"
tokio = { version = "1.53.2", features = ["full"] }

[[bin]]
name = "minimal-vm-liveness-agent"
path = "src/main.rs"

[[test]]
name = "end_to_end"
harness = true
